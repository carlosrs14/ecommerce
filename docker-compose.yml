version: '3.9'

services:
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - eureka-network


  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    ports:
      - "8000"
    environment:
      URL_DB: jdbc:postgresql://products-db:5432/${NAME_DB}
      USER_DB: ${USER_DB}
      PASSWORD_DB: ${PASSWORD_DB}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
    networks:
      - eureka-network
    deploy:
      replicas: 3
    depends_on:
      - eureka-server
      - products-db
    env_file:
      - .env


  microservice-client-new:
    build:
      context: ./microservice-client-new
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    networks:
      - eureka-network
    depends_on:
      - eureka-server

  
  microservice-client-old:
    build:
      context: ./microservice-client-old
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    networks:
      - eureka-network
    depends_on:
      - eureka-server
    
  products-db:
    container_name: products-db
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${USER_DB}
      POSTGRES_PASSWORD: ${PASSWORD_DB}
      POSTGRES_DB: ${NAME_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eureka-network

volumes:
  postgres_data:


networks:
  eureka-network:
    driver: bridge
